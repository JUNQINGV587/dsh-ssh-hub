# dsh-multi-server bundle patch — mounts the multi-server SSH terminal panel
# as a profile layer. Declared by package.json's dsh.bundle.patch: installing
# the package via `dsh plugin --profile web add dsh-multi-server` reconciles
# it into dsh.profile.bundles and this layer is applied automatically.
- insert:
  - id: multi-server
    name: dsh-multi-server
